<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .panel{fill:#0d1117;stroke:#3d2d55;stroke-width:4}.title{font:700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d2a8ff;letter-spacing:1px}
    .name{font:700 26px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3}.body{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#b1bac4}
    .chip{fill:#161b22;stroke:#30363d;stroke-width:2}.chiptext{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
    .status{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7ee787}.muted{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
  </style>
  <rect x="2" y="2" width="996" height="296" class="panel"/>
  <text x="34" y="45" class="title">◆ CURRENT QUEST</text>
  <text x="790" y="45" class="status">[ IN DEVELOPMENT ]</text>
  <line x1="30" y1="62" x2="970" y2="62" stroke="#30363d" stroke-width="2"/>

  <text x="42" y="106" class="name">Narrative Studio</text>
  <text x="42" y="140" class="body">A Next.js workspace for visual-novel planning, retrieval,</text>
  <text x="42" y="165" class="body">AI generation, memory and continuity checks.</text>

  <rect x="42" y="193" width="94" height="30" rx="2" class="chip"/><text x="58" y="213" class="chiptext">TypeScript</text>
  <rect x="148" y="193" width="70" height="30" rx="2" class="chip"/><text x="161" y="213" class="chiptext">Next.js</text>
  <rect x="230" y="193" width="82" height="30" rx="2" class="chip"/><text x="244" y="213" class="chiptext">Supabase</text>
  <rect x="324" y="193" width="68" height="30" rx="2" class="chip"/><text x="340" y="213" class="chiptext">Prisma</text>
  <rect x="404" y="193" width="88" height="30" rx="2" class="chip"/><text x="417" y="213" class="chiptext">OpenRouter</text>

  <text x="42" y="257" class="muted">Focus: story canon · semantic memory · generation jobs · continuity</text>

  <a href="https://github.com/Lmnhutw/visual-novel-gen" target="_blank">
    <rect x="772" y="215" width="178" height="46" fill="#0f141b" stroke="#7ee787" stroke-width="2"/>
    <text x="800" y="244" class="status">VIEW QUEST →</text>
  </a>
</svg>
