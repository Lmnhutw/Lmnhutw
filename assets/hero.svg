<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vincent - Software Developer</title>
  <desc id="desc">Pixel Quest Window developer profile for Vincent, GitHub user Lmnhutw</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <style>
      .bg{fill:#0d1117}.panel{fill:#0f141b;stroke:#30363d;stroke-width:4}.corner{fill:#7ee787}
      .eyebrow{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e;letter-spacing:2px}
      .name{font:700 40px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3;letter-spacing:2px}
      .role{font:700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7ee787}
      .body{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#b1bac4}
      .label{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d2a8ff;letter-spacing:1px}
      .small{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .link{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#79c0ff}
      .dot{fill:#7ee787;animation:pulse 1.8s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect class="bg" width="1000" height="320"/>
  <rect x="2" y="2" width="996" height="316" class="panel"/>
  <rect x="18" y="18" width="10" height="10" class="corner"/><rect x="972" y="18" width="10" height="10" class="corner"/>
  <rect x="18" y="292" width="10" height="10" class="corner"/><rect x="972" y="292" width="10" height="10" class="corner"/>

  <!-- Vincent pixel sprite -->
  <rect x="28" y="28" width="210" height="264" fill="url(#grid)" stroke="#21262d" stroke-width="2"/>
  <text x="48" y="58" class="eyebrow">PLAYER 01</text>
  <g transform="translate(72 80)" shape-rendering="crispEdges">
    <!-- shadow -->
    <rect x="12" y="146" width="92" height="10" fill="#090c10"/>
    <!-- legs -->
    <rect x="34" y="112" width="18" height="34" fill="#202733"/>
    <rect x="66" y="112" width="18" height="34" fill="#202733"/>
    <rect x="28" y="142" width="28" height="10" fill="#11161d"/>
    <rect x="62" y="142" width="28" height="10" fill="#11161d"/>
    <!-- hoodie body -->
    <rect x="24" y="68" width="72" height="48" fill="#242d3a"/>
    <rect x="16" y="76" width="16" height="38" fill="#242d3a"/>
    <rect x="88" y="76" width="16" height="38" fill="#242d3a"/>
    <rect x="46" y="72" width="28" height="6" fill="#7ee787" opacity=".75"/>
    <!-- neck -->
    <rect x="50" y="56" width="20" height="14" fill="#d79b78"/>
    <!-- face -->
    <rect x="36" y="24" width="48" height="38" fill="#e3aa82"/>
    <rect x="42" y="56" width="36" height="10" fill="#d79b78"/>
    <!-- hair -->
    <rect x="32" y="16" width="56" height="14" fill="#11161d"/>
    <rect x="26" y="24" width="14" height="30" fill="#11161d"/>
    <rect x="80" y="22" width="14" height="28" fill="#11161d"/>
    <rect x="40" y="10" width="38" height="12" fill="#11161d"/>
    <rect x="34" y="8" width="12" height="12" fill="#11161d"/>
    <rect x="70" y="6" width="12" height="16" fill="#11161d"/>
    <!-- eyes -->
    <rect x="44" y="38" width="6" height="6" fill="#0d1117"/>
    <rect x="70" y="38" width="6" height="6" fill="#0d1117"/>
    <!-- tiny laptop -->
    <rect x="100" y="92" width="36" height="24" fill="#30363d"/>
    <rect x="104" y="96" width="28" height="16" fill="#0d1117"/>
    <rect x="110" y="100" width="12" height="3" fill="#79c0ff"/>
    <rect x="106" y="106" width="20" height="3" fill="#7ee787"/>
  </g>
  <text x="54" y="270" class="small">@Lmnhutw</text>

  <!-- Main identity -->
  <text x="278" y="58" class="eyebrow">PLAYER PROFILE</text>
  <text x="278" y="108" class="name">VINCENT</text>
  <text x="278" y="140" class="role">SOFTWARE DEVELOPER</text>
  <text x="278" y="177" class="body">Building full-stack products, AI-assisted</text>
  <text x="278" y="201" class="body">workflows and creative developer tools.</text>

  <text x="278" y="239" class="label">FOCUS</text>
  <text x="278" y="266" class="body">Web Products × AI Systems × Creative Software</text>

  <!-- Right status window -->
  <rect x="720" y="42" width="238" height="224" fill="#0b0f14" stroke="#30363d" stroke-width="3"/>
  <text x="744" y="72" class="label">STATUS</text>
  <circle cx="750" cy="99" r="6" class="dot"/>
  <text x="768" y="104" class="body">Currently building</text>

  <text x="744" y="140" class="label">LOCATION</text>
  <text x="744" y="166" class="body">Ho Chi Minh City, Vietnam</text>

  <text x="744" y="202" class="label">LINKS</text>
  <a href="mailto:lmnhut0211@gmail.com"><text x="744" y="205" class="link">lmnhut0211@gmail.com</text></a>
  <a href="https://www.linkedin.com/in/minhnhut0211/" target="_blank"><text x="744" y="228" class="link">linkedin.com/in/minhnhut0211</text></a>
  <a href="https://github.com/Lmnhutw" target="_blank"><text x="744" y="251" class="link">github.com/Lmnhutw</text></a>
  <a href="https://animio.io.vn/" target="_blank"><text x="744" y="274" class="link">animio.io.vn</text></a>

  <text x="720" y="294" class="small">BUILD › LEARN › EXPLORE › REPEAT</text>
</svg>
